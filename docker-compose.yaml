# Local single-host run of the LandGuard API (development / testing).
# Production (landguard.online + api.landguard.online over HTTPS) uses deploy/docker-compose.prod.yml.
services:
  landguard-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in your environment before starting}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-180}
      TRUST_PROXY: "false"
    ports:
      - "8000:8000"
    volumes:
      - landguard-data:/data
    restart: unless-stopped

volumes:
  landguard-data:
